syntax = "proto3";

package mcp;

option go_package = "github.com.google/gRPC";

service MCP {
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc ListTools() returns (ListToolsResponse);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

message InitializeRequest {}

message InitializeResponse {
  string server_id = 1;
  string server_name = 2;
}

message ListToolsResponse {
  repeated ToolDescriptor tools = 1;
}

message ToolDescriptor {
  string name = 1;
  string description = 2;
  map<string, string> input_schema = 3;
}

message CallToolRequest {
  string tool_name = 1;
  optional string arguments_json = 2;
}

message CallToolResponse {
  repeated TextBlock content = 1;
  bool is_error = 2;
}

message TextBlock {
  string type = 1;
  string text = 2;
}
